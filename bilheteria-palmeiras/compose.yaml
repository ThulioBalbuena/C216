services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bilheteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bilheteria_demo}
      POSTGRES_DB: ${POSTGRES_DB:-bilheteria}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      POSTGRES_HOST: database
      POSTGRES_USER: ${POSTGRES_USER:-bilheteria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bilheteria_demo}
      POSTGRES_DB: ${POSTGRES_DB:-bilheteria}
      CORS_ORIGINS: http://localhost:${WEB_PORT:-8081},http://127.0.0.1:${WEB_PORT:-8081}
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/api/health"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  database-data:
