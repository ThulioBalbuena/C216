[tool.poetry]
name = "bilheteria-palmeiras-api"
version = "0.1.0"
description = "API da Bilheteria Palmeiras"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116"
uvicorn = "^0.35"
sqlalchemy = "^2.0"
alembic = "^1.16"
psycopg = { version = "^3.2", extras = ["binary"] }

[tool.poetry.group.dev.dependencies]
ruff = "^0.12"

[tool.ruff]
target-version = "py312"
line-length = 100
